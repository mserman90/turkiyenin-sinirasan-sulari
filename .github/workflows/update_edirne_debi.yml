name: DSİ Edirne Meriç-Tunca-Ergene Debi Güncelle

on:
  # NOT: DSİ 11. Bölge sunucusu (212.174.165.59:443), GitHub barındırılan ABD Azure
  # runner'larından gelen TCP bağlantılarını düşürmektedir (run 43016803414 teşhisi).
  # Türkiye içinde bir `self-hosted` runner bağladığınızda aşağıdaki `schedule` bloğunu
  # açabilirsiniz; Windows'ta yerel otomatik çekim için `scripts/fetch_edirne_debi.ps1 -Push -InstallSchedule` kullanın.
  # schedule:
  #   - cron: '30 5,11,17 * * *'
  workflow_dispatch:
    inputs:
      runner:
        description: 'Çalıştırılacak runner türü (Türkiye içi self-hosted önerilir)'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

permissions:
  contents: write

jobs:
  fetch-edirne-debi:
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Playwright Chromium kur (Linux runner için)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/pw
          npm --prefix /tmp/pw install --no-save playwright
          /tmp/pw/node_modules/.bin/playwright install --with-deps chromium

      - name: DSİ 11. Bölge debi tablosunu çek
        env:
          NODE_PATH: /tmp/pw/node_modules
        run: node scripts/fetch_edirne_debi.mjs

      - name: Değişiklik varsa kaydet ve gönder
        run: |
          if git diff --quiet data/edirne_debi.json; then
            echo "Yeni debi değişikliği yok."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/edirne_debi.json
          git commit -m "chore: update Edirne Meric-Tunca-Ergene river discharge [skip ci]"
          git push
